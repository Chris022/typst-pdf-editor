<html lang="en">

    <title>Tinymist Previewer Fixture</title>
  </head>

    <main id="fixture-previewer">Hello from the fixture previewer</main>
    <!-- INJECT_SCRIPT -->

      window.__TINYMIST_PROVIDER_FIXTURE_LOADED__ = true;

    <canvas id="preview-canvas" width="1000pt" height="1000pt"></canvas>
